name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  # Manual re-deploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One in-flight deploy at a time; don't cancel a publish midway.
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # FIREBASE_SERVICE_ACCOUNT lives as an *environment* secret on the `firebase`
    # environment; without this line the job cannot see it and the deploy step is skipped.
    environment:
      name: firebase
      url: https://mentara-ai-landing.web.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Builds with `astro build` (runs the `prebuild` icon generation first). SITE_URL /
      # BASE_PATH derive the canonical/OG/hreflang/sitemap URLs (astro.config.mjs); unset
      # repo variables fall back to the live *.web.app domain there. Set the SITE_URL
      # variable to the custom domain once one is chosen and its DNS points at Firebase.
      # See README → Custom domain / Firebase Hosting.
      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      # Requires a repo secret FIREBASE_SERVICE_ACCOUNT holding a Firebase service-account
      # JSON key (Firebase console → Project settings → Service accounts → Generate new
      # private key). This repo is public – that key must live ONLY in GitHub Actions
      # secrets, never committed.
      #
      # The deploy is skipped (not failed) when the secret is absent: a fork or a fresh
      # clone should still get a green build instead of an opaque "Input required and not
      # supplied: firebaseServiceAccount" crash inside the action.
      - name: Check deploy credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set – skipping the Firebase deploy. Add the service-account JSON under Settings → Secrets and variables → Actions to enable publishing."
          fi

      # projectId is the real Firebase project id, not the .firebaserc alias – the action
      # does not resolve aliases.
      - name: Deploy to Firebase Hosting
        if: steps.creds.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mentara-ai-landing
          channelId: live

  # Quality gate – independent of deploy on purpose: a Lighthouse dip must never block a
  # publish. Assertions are warnings (see lighthouserc.json).
  audit:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Build base-less so Lighthouse CI's static server (serves dist at "/") gets a
      # self-consistent site; the base path doesn't affect the audited scores.
      - name: Build (no base)
        run: npm run build
        env:
          BASE_PATH: /

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
