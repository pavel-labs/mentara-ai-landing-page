# Used as an nginx template: the nginx:alpine entrypoint runs envsubst over it at container
# start and substitutes ${PORT}. Railway injects a dynamic PORT and routes the public domain
# to it. $uri and friends are nginx runtime variables, not env vars, so envsubst leaves them
# alone.
# Railway routes both mentarika.app and www.mentarika.app to this same service/container;
# tell them apart by Host and send www to the canonical root instead of serving the same
# content twice (bad for SEO — two URLs for one page).
server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name www.mentarika.app;
    include /etc/nginx/security-headers.conf;
    return 301 https://mentarika.app$request_uri;
}

server {
    listen ${PORT} default_server;
    listen [::]:${PORT} default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Railway terminates TLS in front of this; HSTS stops the *first* request from being
    # downgradeable to plain HTTP.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2 application/rss+xml application/xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Managed-content export the admin console's CMS preview fetches cross-origin (mirrors
    # firebase.json's header for the same path).
    location ^~ /marketing/defaults/ {
        include /etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri.html =404;
    }

    # CMS live-preview pages: never indexed, never cached (mirrors firebase.json).
    location ^~ /preview/ {
        include /etc/nginx/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Astro/Vite build assets are content-hashed and emitted under _astro, including when
    # BASE_PATH prefixes the site URL.
    location ~* ^/(?:.*/)?_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Public files keep stable URLs (for example localized OG images), so revalidate them
    # regularly instead of marking them immutable.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # Astro's static output, one prerendered file per route (English at /, every other
    # locale under /<code>/) — revalidate HTML so deploys become visible promptly. This is
    # not an SPA, so an unknown path is a real 404, not the homepage. `expires -1` emits
    # no-cache without overriding the security headers inherited from the server block.
    location / {
        expires -1;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
