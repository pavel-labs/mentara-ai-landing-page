# Used as an nginx template: the nginx:alpine entrypoint runs envsubst over it at container
# start and substitutes ${PORT}. Railway injects a dynamic PORT and routes the public domain
# to it. $uri and friends are nginx runtime variables, not env vars, so envsubst leaves them
# alone.
server {
    listen ${PORT} default_server;
    listen [::]:${PORT} default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Railway terminates TLS in front of this; the header stops the *first* request from
    # being downgradeable to plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2 application/rss+xml application/xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Managed-content export the admin console's CMS preview fetches cross-origin (mirrors
    # firebase.json's header for the same path).
    location ^~ /marketing/defaults/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri.html =404;
    }

    # CMS live-preview pages: never indexed, never cached (mirrors firebase.json).
    location ^~ /preview/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Hashed build assets (content-addressed filenames) — cache for a year.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Astro's static output, one prerendered file per route (English at /, every other
    # locale under /<code>/) — not an SPA, so an unknown path is a real 404, not the
    # homepage.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
